{{ template "widget-base.html" . }}

{{ define "widget-content" }}
<div class="bookmarks-cards-groups">
    {{- range $groupIndex, $group := .Groups }}
    <div class="bookmarks-group"{{ if $group.Color }} style="--bookmarks-group-color: {{ $group.Color.String | safeCSS }}"{{ end }}>
        {{- if ne $group.Title "" }}
        <div class="bookmarks-group-title size-h3 margin-bottom-7">{{ $group.Title }}</div>
        {{- end }}
        <div class="bookmarks-cards">
            {{- range $group.Links }}
            {{ template "bookmark-card.html" . }}
            {{- end }}
            {{- if $.AllowAdd }}
            <div class="bookmarks-card bookmarks-add" data-bookmarks-id="{{ $.BookmarksID }}" data-group-index="{{ $groupIndex }}"></div>
            {{- end }}
        </div>
    </div>
    {{- end }}
</div>
{{ end }}
